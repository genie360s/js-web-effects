name: Pages

# The site is the landing page plus one live demo per effect, at
# https://genie360s.github.io/js-web-effects/<package>/.
# It redeploys on every push to main, and the Publish workflow starts it again
# after every release, so a publish to npm always comes with an up-to-date page.
#
# Not `on: release` directly: a release runs on its tag, and the github-pages
# environment only accepts deployments from main, so that run builds and then
# has its deploy refused.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: rustup target add wasm32-unknown-unknown
      - run: npm ci
      - run: npm run wasm
      - run: npm run build
      - name: Fetch the videos (kept as release assets, not in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download videos --dir videos --pattern '*.mp4' || echo "no videos release yet, deploying without them"
      - run: npm run site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  # Its own job, as in GitHub's Pages template: deploying in the same job as
  # the upload can ask for the artifact before the API lists it, and fail.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
