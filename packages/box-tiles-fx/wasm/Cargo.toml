[package]
name = "tiles-core"
version = "1.0.0"
edition = "2021"
license = "MIT"
authors = ["Alex Mkwizu <alexgmkwizu@gmail.com>"]
description = "A grid of title-sequence tiles that black out, shift and flare, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
