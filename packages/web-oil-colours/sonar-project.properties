# Run with:  sonar-scanner -Dsonar.host.url=<server> -Dsonar.token=<token>
# (SonarQube analysis needs a server; the scanner fetches its quality profile
#  from one and pushes results back. There is no offline mode.)
sonar.projectKey=web-oil-colours
sonar.projectName=web oil colours
sonar.sources=src,wasm/src,scripts
sonar.tests=wasm/test.mjs
sonar.exclusions=**/node_modules/**,dist/**,wasm/target/**,src/sim/*.wasm
sonar.sourceEncoding=UTF-8
