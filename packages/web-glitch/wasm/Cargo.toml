[package]
name = "glitch-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Alex Mkwizu <alexgmkwizu@gmail.com>"]
description = "A picture that arrives in blocks and flicks between dots, mosaic, mask and characters, compiled to WebAssembly."

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
