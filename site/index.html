<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="JS web effects with Rust and WebAssembly cores: fire, sand, water, oil paint, tearable cloth and title-sequence tiles, running on real page content." />
    <title>JS Web Effects</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23e08a45'/%3E%3C/svg%3E" />
    <style>
      :root { --bg: #0d0c0b; --card: #171513; --line: #2b2723; --ink: #f1ece4; --dim: #a59c90; --accent: #e08a45; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
      header, main, footer { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
      header { padding-top: 72px; padding-bottom: 40px; }
      h1 { margin: 0 0 12px; font-size: clamp(2.2rem, 6vw, 4rem); line-height: 1; letter-spacing: -0.04em; }
      header p { margin: 0; max-width: 62ch; color: var(--dim); font-size: 1.1rem; }
      main { display: grid; gap: 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 500px), 1fr)); }
      article { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; scroll-margin-top: 16px; }
      video, article img { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; object-fit: cover; }
      .body { padding: 20px; }
      h2 { margin: 0 0 6px; font-size: 1.35rem; letter-spacing: -0.02em; }
      h2 small { color: var(--dim); font-size: 0.8rem; font-weight: 500; letter-spacing: 0; }
      .body p { margin: 0 0 14px; color: var(--dim); }
      pre { margin: 0 0 16px; padding: 10px 12px; overflow-x: auto; background: #0b0a09; border: 1px solid var(--line); border-radius: 8px; }
      code { font: 0.9rem ui-monospace, SFMono-Regular, Menlo, monospace; }
      nav { display: flex; flex-wrap: wrap; gap: 8px; }
      nav a { padding: 7px 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--ink); text-decoration: none; font-size: 0.92rem; }
      nav a:hover, nav a:focus-visible { border-color: var(--accent); }
      nav a.primary { background: var(--accent); border-color: var(--accent); color: #1a0f06; font-weight: 600; }
      footer { padding-top: 40px; padding-bottom: 56px; color: var(--dim); font-size: 0.92rem; }
      footer a { color: var(--ink); }
    </style>
  </head>
  <body>
    <header>
      <h1>JS Web Effects</h1>
      <p>
        Physical effects that run on what a page actually contains: text, forms, images and playing video.
        Each one is a solver written in Rust, compiled to WebAssembly, and drawn with WebGL2.
        Every video below shows how its effect works.
      </p>
    </header>
    <main>
<!-- effects -->
    </main>
    <footer>
      MIT licensed. Source on <a href="https://github.com/genie360s/js-web-effects">GitHub</a>.
    </footer>
  </body>
</html>
